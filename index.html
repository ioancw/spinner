<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spinner Wheel — Name Picker</title>
<style>
  :root {
    --bg: #0f1024;
    --panel: #1b1d3a;
    --accent: #ffcb05;
    --text: #f4f4ff;
    --muted: #a6a8d0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, #232653 0%, var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 {
    font-size: clamp(1.3rem, 4vw, 2rem);
    margin: 0.4em 0 0.2em;
    text-align: center;
  }
  .subtitle { color: var(--muted); margin: 0 0 12px; text-align: center; font-size: 0.9rem; }
  .ticker {
    font-size: clamp(1.4rem, 6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 0.5px;
    min-height: 1.4em;
    text-align: center;
    color: var(--accent);
    text-shadow: 0 2px 12px rgba(255, 203, 5, 0.35);
    transition: transform 0.15s ease;
  }
  .ticker.win { transform: scale(1.12); }
  .wheel-wrap {
    position: relative;
    width: min(90vw, 440px);
    aspect-ratio: 1 / 1;
    margin: 8px 0 4px;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 26px solid var(--accent);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    z-index: 3;
  }
  .hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 22%; height: 22%;
    border-radius: 50%;
    background: var(--accent);
    color: #1b1d3a;
    border: 5px solid #fff;
    font-weight: 800;
    font-size: clamp(0.8rem, 3vw, 1.1rem);
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    z-index: 2;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hub:active { transform: translate(-50%, -50%) scale(0.94); }
  .controls {
    width: min(92vw, 440px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid #34376b;
    background: var(--panel);
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    line-height: 1.4;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto;
    min-width: 120px;
    padding: 12px 14px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    color: #1b1d3a;
    background: #d7d9f5;
    transition: transform 0.08s ease, filter 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button.primary { background: var(--accent); }
  button:active { transform: translateY(1px); }
  button:disabled { filter: grayscale(0.6) opacity(0.6); cursor: default; }
  .hint { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 4px 0 24px; }
  @media (prefers-reduced-motion: reduce) {
    .ticker, .ticker.win, .hub:active, button:active { transition: none; }
  }
</style>
</head>
<body>
  <h1>🎡 Spinner Wheel</h1>
  <p class="subtitle">Tap the hub or press Spin to pick a name</p>

  <div class="ticker" id="ticker" aria-live="polite">Ready!</div>

  <div class="wheel-wrap">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="600" height="600" aria-label="Spinner wheel"></canvas>
    <button class="hub" id="hub" type="button" aria-label="Spin the wheel">SPIN</button>
  </div>

  <div class="controls">
    <label for="names" class="hint" style="text-align:left;margin:0 0 -4px 2px;">Names (one per line)</label>
    <textarea id="names" spellcheck="false" aria-label="Names, one per line"></textarea>
    <div class="btn-row">
      <button id="update" type="button">Update wheel</button>
      <button id="reset" type="button">Reset to book names</button>
    </div>
    <div class="btn-row">
      <button id="spin" class="primary" type="button">Spin</button>
    </div>
  </div>
  <p class="hint">Lands on a random segment using <code>Math.random()</code>.</p>

<script>
(function () {
  "use strict";

  var DEFAULT_NAMES = [
    "Matilda", "Charlie", "Sophie", "Pippi", "Charlotte", "Despereaux",
    "Lyra", "Stuart", "Coraline", "Hermione", "Stanley", "Auggie",
    "Templeton", "Fern", "Willy Wonka", "James", "Lucy", "Aslan",
    "Peter", "Bilbo"
  ];

  var PALETTE = [
    "#e63946", "#f4a261", "#2a9d8f", "#457b9d", "#e76f51",
    "#8338ec", "#3a86ff", "#ff006e", "#06d6a0", "#ffbe0b"
  ];

  var prefersReduced = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var ticker = document.getElementById("ticker");
  var namesInput = document.getElementById("names");

  var names = DEFAULT_NAMES.slice();
  var rotation = 0;          // current rotation in radians
  var spinning = false;
  var tickerTimer = null;

  function size() { return canvas.width; }

  function drawWheel() {
    var n = names.length;
    var w = size();
    var cx = w / 2, cy = w / 2;
    var radius = w / 2 - 6;
    ctx.clearRect(0, 0, w, w);

    if (n === 0) {
      ctx.fillStyle = "#34376b";
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + (w * 0.04) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Add some names", cx, cy);
      return;
    }

    var arc = (Math.PI * 2) / n;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    for (var i = 0; i < n; i++) {
      var start = i * arc;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, start, start + arc);
      ctx.closePath();
      ctx.fillStyle = PALETTE[i % PALETTE.length];
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.18)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // label
      ctx.save();
      ctx.rotate(start + arc / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "rgba(0,0,0,0.45)";
      ctx.shadowBlur = 3;
      var fontSize = Math.max(11, Math.min(w * 0.045, (radius * 0.9) / Math.max(names[i].length, 6) * 1.6));
      ctx.font = "bold " + fontSize + "px system-ui, sans-serif";
      var label = names[i].length > 16 ? names[i].slice(0, 15) + "…" : names[i];
      ctx.fillText(label, radius - 14, 0);
      ctx.restore();
    }
    ctx.restore();

    // outer rim
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 6;
    ctx.stroke();
  }

  // The pointer sits at the top (12 o'clock = -PI/2 in canvas coords).
  // Determine which segment is under the pointer for a given rotation.
  function winnerIndex() {
    var n = names.length;
    if (n === 0) return -1;
    var arc = (Math.PI * 2) / n;
    // Angle at pointer, relative to wheel's own frame.
    var pointerAngle = (-Math.PI / 2) - rotation;
    // normalize to [0, 2PI)
    var a = ((pointerAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / arc) % n;
  }

  function startTickerFlash() {
    stopTickerFlash();
    ticker.classList.remove("win");
    tickerTimer = setInterval(function () {
      if (names.length === 0) return;
      var r = Math.floor(Math.random() * names.length);
      ticker.textContent = names[r];
    }, 80);
  }
  function stopTickerFlash() {
    if (tickerTimer) { clearInterval(tickerTimer); tickerTimer = null; }
  }

  function announceWinner() {
    var idx = winnerIndex();
    if (idx < 0) { ticker.textContent = "Add some names"; return; }
    ticker.textContent = names[idx];
    ticker.classList.add("win");
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function spin() {
    if (spinning || names.length === 0) return;
    spinning = true;
    setButtonsDisabled(true);

    // Pick the random outcome up front using Math.random().
    var n = names.length;
    var arc = (Math.PI * 2) / n;
    var target = Math.floor(Math.random() * n);

    // Compute a rotation that lands `target` under the pointer.
    // We want winnerIndex() === target at the end. Solve for rotation:
    //   pointerAngle = -PI/2 - rotation ; segment = floor(norm(pointerAngle)/arc)
    // Aim for the centre of the target segment.
    var desiredPointer = target * arc + arc / 2;        // centre of target in wheel frame
    var baseRotation = -Math.PI / 2 - desiredPointer;   // rotation that puts it under pointer
    var fullSpins = 5 + Math.floor(Math.random() * 3);  // 5..7 turns
    var finalRotation = baseRotation - fullSpins * Math.PI * 2;

    if (prefersReduced) {
      rotation = ((finalRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      drawWheel();
      announceWinner();
      spinning = false;
      setButtonsDisabled(false);
      return;
    }

    startTickerFlash();

    var startRotation = rotation;
    var delta = finalRotation - startRotation;
    var duration = 4200 + Math.random() * 800;
    var startTime = null;

    function frame(now) {
      if (startTime === null) startTime = now;
      var elapsed = now - startTime;
      var t = Math.min(elapsed / duration, 1);
      rotation = startRotation + delta * easeOutCubic(t);
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = ((finalRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        drawWheel();
        stopTickerFlash();
        announceWinner();
        spinning = false;
        setButtonsDisabled(false);
      }
    }
    requestAnimationFrame(frame);
  }

  function setButtonsDisabled(d) {
    document.getElementById("spin").disabled = d;
    document.getElementById("update").disabled = d;
    document.getElementById("reset").disabled = d;
    document.getElementById("hub").disabled = d;
  }

  function parseNames(text) {
    return text.split("\n")
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  function syncTextarea() { namesInput.value = names.join("\n"); }

  function updateFromTextarea() {
    if (spinning) return;
    var parsed = parseNames(namesInput.value);
    names = parsed;
    rotation = 0;
    drawWheel();
    ticker.classList.remove("win");
    ticker.textContent = names.length ? "Ready!" : "Add some names";
  }

  function resetNames() {
    if (spinning) return;
    names = DEFAULT_NAMES.slice();
    syncTextarea();
    rotation = 0;
    drawWheel();
    ticker.classList.remove("win");
    ticker.textContent = "Ready!";
  }

  // Wire up
  document.getElementById("spin").addEventListener("click", spin);
  document.getElementById("hub").addEventListener("click", spin);
  document.getElementById("update").addEventListener("click", updateFromTextarea);
  document.getElementById("reset").addEventListener("click", resetNames);

  // Init
  syncTextarea();
  drawWheel();
})();
</script>
</body>
</html>
