<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Random Wheel of Class Rep</title>
<style>
  :root {
    --accent: #ffcb05;
    --text: #f4f4ff;
    --muted: #a6a8d0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #1a0b2e 0%, #16213e 35%, #0f3460 70%, #1a0b2e 100%);
    background-size: 300% 300%;
    animation: bgShift 18s ease infinite;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h1 {
    font-size: clamp(1.5rem, 5.4vw, 2.5rem);
    margin: 0.4em 0 0.2em;
    text-align: center;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #fff6c0 0%, #ffd23f 45%, #ffb400 55%, #f79b00 100%);
    background-size: 100% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3.5s ease-in-out infinite;
    filter: drop-shadow(0 2px 0 #8a5200) drop-shadow(0 3px 6px rgba(0,0,0,0.55));
  }
  @keyframes shimmer {
    0%, 100% { background-position: 50% 0%; }
    50%      { background-position: 50% 100%; }
  }
  .subtitle { color: var(--muted); margin: 0 0 12px; text-align: center; font-size: 0.9rem; }
  .ticker {
    font-size: clamp(1.5rem, 6.5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: 0.5px;
    min-height: 1.4em;
    text-align: center;
    color: var(--accent);
    text-shadow: 0 2px 12px rgba(255, 203, 5, 0.35);
  }
  .ticker.flashing {
    color: #fff;
    animation: tickerPulse 0.18s ease-in-out infinite alternate;
  }
  @keyframes tickerPulse {
    from { text-shadow: 0 0 8px rgba(255,255,255,0.5); }
    to   { text-shadow: 0 0 22px rgba(58,134,255,0.9), 0 0 38px rgba(255,0,110,0.6); }
  }
  .ticker.win {
    color: #fff;
    animation: winPop 0.6s cubic-bezier(.18,.89,.32,1.28) both, winGlow 1.1s ease-in-out infinite alternate;
  }
  @keyframes winPop {
    0%   { transform: scale(0.6); }
    60%  { transform: scale(1.25); }
    100% { transform: scale(1.12); }
  }
  @keyframes winGlow {
    from { text-shadow: 0 0 14px rgba(255,203,5,0.8), 0 0 28px rgba(255,0,110,0.5); }
    to   { text-shadow: 0 0 26px rgba(255,203,5,1), 0 0 52px rgba(58,134,255,0.8); }
  }
  .wheel-wrap {
    position: relative;
    width: min(90vw, 460px);
    aspect-ratio: 1 / 1;
    margin: 8px 0 4px;
  }
  .wheel-glow {
    position: absolute;
    inset: -6%;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff006e, #ffcb05, #06d6a0, #3a86ff, #8338ec, #ff006e);
    filter: blur(22px);
    opacity: 0.55;
    z-index: 0;
    animation: glowSpin 6s linear infinite;
  }
  .wheel-wrap.spinning .wheel-glow { animation-duration: 1.2s; opacity: 0.8; }
  @keyframes glowSpin { to { transform: rotate(360deg); } }
  canvas#wheel { position: relative; width: 100%; height: 100%; display: block; touch-action: manipulation; z-index: 1; }
  /* Red Wheel-of-Fortune flapper, pivoting from the top */
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    width: 0; height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 40px solid #e01e2c;
    transform: translateX(-50%);
    transform-origin: 50% 4px;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.55));
    z-index: 4;
  }
  .pointer::after {
    content: "";
    position: absolute;
    top: -18px; left: -9px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #d0d0d0 55%, #888);
    box-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .pointer.kick { animation: kick 0.13s ease; }
  @keyframes kick {
    0%   { transform: translateX(-50%) rotate(0deg); }
    45%  { transform: translateX(-50%) rotate(16deg); }
    100% { transform: translateX(-50%) rotate(0deg); }
  }
  .hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 23%; height: 23%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #d7dbe0 45%, #9aa0a8 80%, #6b7078);
    color: #22252e;
    border: 5px solid #f4d35e;
    font-weight: 900;
    font-size: clamp(0.8rem, 3vw, 1.1rem);
    letter-spacing: 1px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    cursor: pointer;
    z-index: 3;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 0 0 rgba(244,211,94,0.8), 0 4px 18px rgba(0,0,0,0.5);
    animation: hubPulse 2s ease-in-out infinite;
  }
  @keyframes hubPulse {
    0%   { box-shadow: 0 0 0 0 rgba(244,211,94,0.8), 0 4px 18px rgba(0,0,0,0.5); }
    70%  { box-shadow: 0 0 0 16px rgba(244,211,94,0), 0 4px 18px rgba(0,0,0,0.5); }
    100% { box-shadow: 0 0 0 0 rgba(244,211,94,0), 0 4px 18px rgba(0,0,0,0.5); }
  }
  .hub:active { transform: translate(-50%, -50%) scale(0.92); }
  .controls {
    width: min(92vw, 460px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid #34376b;
    background: rgba(27, 29, 58, 0.85);
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    line-height: 1.4;
  }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto;
    min-width: 120px;
    padding: 12px 14px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    color: #1b1d3a;
    background: #d7d9f5;
    transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:disabled { filter: grayscale(0.6) opacity(0.6); cursor: default; }
  .hint { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 4px 0 24px; }
  .field-label { color: var(--muted); font-size: 0.8rem; margin: 0 0 -4px 2px; }

  /* Confetti + winner banner overlay */
  #fx {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50;
  }
  .winner-banner {
    position: fixed;
    top: 38%; left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    background: linear-gradient(135deg, rgba(255,0,110,0.95), rgba(131,56,236,0.95));
    color: #fff;
    padding: 18px 30px;
    border-radius: 18px;
    font-weight: 900;
    font-size: clamp(1.4rem, 6vw, 2.6rem);
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,255,255,0.25) inset;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    max-width: 88vw;
  }
  .winner-banner.show { animation: bannerIn 2.4s cubic-bezier(.18,.89,.32,1.28) forwards; }
  .winner-banner small { display: block; font-size: 0.5em; font-weight: 700; opacity: 0.85; margin-bottom: 4px; }
  @keyframes bannerIn {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5) rotate(-6deg); }
    12%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08) rotate(2deg); }
    20%  { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    82%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(0.95); }
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    h1 { animation: none; -webkit-text-fill-color: var(--accent); }
    .ticker, .ticker.win, .ticker.flashing, .hub, .wheel-glow, .hub:active, button:active { animation: none; transition: none; }
    .winner-banner.show { animation: none; opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }
</style>
</head>
<body>
  <h1>🎡 Random Wheel of Class Rep</h1>
  <p class="subtitle" id="strap">Who's it going to be?</p>

  <div class="ticker" id="ticker" aria-live="polite">Ready!</div>

  <div class="wheel-wrap" id="wheelWrap">
    <div class="wheel-glow" aria-hidden="true"></div>
    <div class="pointer" id="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="600" height="600" aria-label="Spinner wheel"></canvas>
    <button class="hub" id="hub" type="button" aria-label="Spin the wheel">SPIN</button>
  </div>

  <div class="controls">
    <label for="names" class="field-label">Names (one per line)</label>
    <textarea id="names" spellcheck="false" aria-label="Names, one per line"></textarea>
    <div class="btn-row">
      <button id="update" type="button">Update wheel</button>
      <button id="reset" type="button">Reset to book names</button>
    </div>
  </div>
  <p class="hint">Lands on a random segment using <code>Math.random()</code>.</p>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="winner-banner" id="banner" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  var DEFAULT_NAMES = [
    "Matilda", "Charlie", "Sophie", "Pippi", "Charlotte",
    "Despereaux", "Lyra", "Coraline", "Hermione", "Auggie",
    "Templeton", "Fern", "James", "Aslan", "Bilbo"
  ];

  // Wheel-of-Fortune-style vibrant wedge colours
  var PALETTE = [
    "#e6194b", "#f58231", "#ffb400", "#3cb44b", "#12b5a5",
    "#2196f3", "#3f51b5", "#8e24aa", "#e91e8c", "#ff5c8a",
    "#8bc34a", "#00bcd4", "#c0392b", "#5c6bc0", "#009e60"
  ];

  var prefersReduced = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var ticker = document.getElementById("ticker");
  var namesInput = document.getElementById("names");
  var wheelWrap = document.getElementById("wheelWrap");
  var pointer = document.getElementById("pointer");
  var banner = document.getElementById("banner");
  var hubBtn = document.getElementById("hub");
  var updateBtn = document.getElementById("update");
  var resetBtn = document.getElementById("reset");

  var names = DEFAULT_NAMES.slice();
  var rotation = 0;          // current rotation in radians
  var spinning = false;
  var tickerTimer = null;
  var lastTickSeg = -1;

  var strap = document.getElementById("strap");
  function updateStrap() {
    var n = names.length;
    strap.textContent = n > 0
      ? "One in " + n + " — who's it going to be?"
      : "Add some names to get started";
  }

  function size() { return canvas.width; }

  // Match the canvas buffer to its displayed size so it stays crisp on
  // high-DPI screens (the 600x600 attributes are only a no-JS fallback).
  function fitCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var px = Math.round(wheelWrap.clientWidth * dpr);
    if (px > 0 && px !== canvas.width) {
      canvas.width = px;
      canvas.height = px;
    }
  }

  /* ---------- Wheel drawing ---------- */
  function drawWheel() {
    var n = names.length;
    var w = size();
    var cx = w / 2, cy = w / 2;
    var radius = w / 2 - 10;
    ctx.clearRect(0, 0, w, w);

    if (n === 0) {
      ctx.fillStyle = "#34376b";
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + (w * 0.04) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Add some names", cx, cy);
      return;
    }

    var arc = (Math.PI * 2) / n;
    var tyreW = Math.max(9, w * 0.03);   // dark outer "tyre" thickness
    var outer = radius - tyreW;           // where the wedges end
    var GOLD = "#f7d774";

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    // colour wedges
    for (var i = 0; i < n; i++) {
      var start = i * arc;
      var base = PALETTE[i % PALETTE.length];
      var grad = ctx.createRadialGradient(0, 0, outer * 0.14, 0, 0, outer);
      grad.addColorStop(0, lighten(base, 0.22));
      grad.addColorStop(0.6, base);
      grad.addColorStop(1, darken(base, 0.10));

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, outer, start, start + arc);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // gold divider spoke on the wedge's leading edge
      ctx.save();
      ctx.rotate(start);
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = Math.max(1.5, w * 0.0045);
      ctx.beginPath();
      ctx.moveTo(outer * 0.05, 0);
      ctx.lineTo(outer, 0);
      ctx.stroke();
      ctx.restore();

      // name — white with a dark outline for readability on any colour
      ctx.save();
      ctx.rotate(start + arc / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      var fontSize = Math.max(11, Math.min(w * 0.046, (outer * 0.82) / Math.max(names[i].length, 6) * 1.7));
      ctx.font = "800 " + fontSize + "px system-ui, sans-serif";
      var label = names[i].length > 15 ? names[i].slice(0, 14) + "…" : names[i];
      ctx.lineJoin = "round";
      ctx.lineWidth = fontSize * 0.2;
      ctx.strokeStyle = "rgba(0,0,0,0.78)";
      ctx.strokeText(label, outer - 14, 0);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(label, outer - 14, 0);
      ctx.restore();
    }

    // dark tyre ring around the wedges
    ctx.beginPath();
    ctx.arc(0, 0, outer + tyreW / 2, 0, Math.PI * 2);
    ctx.strokeStyle = "#161616";
    ctx.lineWidth = tyreW;
    ctx.stroke();

    // gold trims on the inner and outer edge of the tyre
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = Math.max(2, w * 0.006);
    ctx.beginPath(); ctx.arc(0, 0, outer + 1, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, radius - 1, 0, Math.PI * 2); ctx.stroke();

    // silver pegs at every wedge boundary — they rotate past the flapper
    var pegR = outer + tyreW / 2;
    var pegRad = Math.max(3, w * 0.0115);
    for (var p = 0; p < n; p++) {
      var pa = p * arc;
      var px = Math.cos(pa) * pegR, py = Math.sin(pa) * pegR;
      var pg = ctx.createRadialGradient(px - pegRad * 0.3, py - pegRad * 0.3, pegRad * 0.2, px, py, pegRad);
      pg.addColorStop(0, "#ffffff");
      pg.addColorStop(0.5, "#d6d6d6");
      pg.addColorStop(1, "#787878");
      ctx.beginPath();
      ctx.arc(px, py, pegRad, 0, Math.PI * 2);
      ctx.fillStyle = pg;
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(0,0,0,0.4)";
      ctx.stroke();
    }

    ctx.restore();
  }

  function lighten(hex, amt) { return mix(hex, "#ffffff", amt); }
  function darken(hex, amt) { return mix(hex, "#000000", amt); }
  function mix(a, b, t) {
    var ca = hex2rgb(a), cb = hex2rgb(b);
    var r = Math.round(ca[0] + (cb[0] - ca[0]) * t);
    var g = Math.round(ca[1] + (cb[1] - ca[1]) * t);
    var bl = Math.round(ca[2] + (cb[2] - ca[2]) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }
  function hex2rgb(h) {
    h = h.replace("#", "");
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  // Pointer at top (12 o'clock = -PI/2). Which segment is under it?
  function winnerIndex() {
    var n = names.length;
    if (n === 0) return -1;
    var arc = (Math.PI * 2) / n;
    var pointerAngle = (-Math.PI / 2) - rotation;
    var a = ((pointerAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / arc) % n;
  }

  function startTickerFlash() {
    stopTickerFlash();
    ticker.classList.remove("win");
    ticker.classList.add("flashing");
    // silence the live region while names strobe; only the winner is announced
    ticker.setAttribute("aria-live", "off");
    tickerTimer = setInterval(function () {
      if (names.length === 0) return;
      var r = Math.floor(Math.random() * names.length);
      ticker.textContent = names[r];
    }, 75);
  }
  function stopTickerFlash() {
    if (tickerTimer) { clearInterval(tickerTimer); tickerTimer = null; }
    ticker.classList.remove("flashing");
    ticker.setAttribute("aria-live", "polite");
  }

  function announceWinner() {
    var idx = winnerIndex();
    if (idx < 0) { ticker.textContent = "Add some names"; return; }
    ticker.textContent = names[idx];
    ticker.classList.add("win");
    showBanner(names[idx]);
    burstConfetti();
  }

  function showBanner(name) {
    banner.innerHTML = "<small>🎉 Winner 🎉</small>" + escapeHtml(name);
    banner.classList.remove("show");
    void banner.offsetWidth; // restart animation
    banner.classList.add("show");
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function spin() {
    if (spinning || names.length === 0) return;
    spinning = true;
    setButtonsDisabled(true);
    wheelWrap.classList.add("spinning");
    lastTickSeg = -1;

    var n = names.length;
    var arc = (Math.PI * 2) / n;
    var target = Math.floor(Math.random() * n);  // random outcome via Math.random()

    var desiredPointer = target * arc + arc / 2;
    var baseRotation = -Math.PI / 2 - desiredPointer;
    var fullSpins = 5 + Math.floor(Math.random() * 3);
    var finalRotation = baseRotation - fullSpins * Math.PI * 2;

    if (prefersReduced) {
      rotation = ((finalRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      drawWheel();
      wheelWrap.classList.remove("spinning");
      announceWinner();
      spinning = false;
      setButtonsDisabled(false);
      return;
    }

    startTickerFlash();

    var startRotation = rotation;
    var delta = finalRotation - startRotation;
    var duration = 4200 + Math.random() * 800;
    var startTime = null;

    function frame(now) {
      if (startTime === null) startTime = now;
      var elapsed = now - startTime;
      var t = Math.min(elapsed / duration, 1);
      rotation = startRotation + delta * easeOutCubic(t);
      drawWheel();

      // tick + pointer kick when crossing a segment boundary
      var seg = winnerIndex();
      if (seg !== lastTickSeg) {
        lastTickSeg = seg;
        pointer.classList.remove("kick");
        void pointer.offsetWidth;
        pointer.classList.add("kick");
      }

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = ((finalRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        drawWheel();
        stopTickerFlash();
        wheelWrap.classList.remove("spinning");
        announceWinner();
        spinning = false;
        setButtonsDisabled(false);
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Confetti ---------- */
  var fx = document.getElementById("fx");
  var fxCtx = fx.getContext("2d");
  var confetti = [];
  var fxRunning = false;

  function resizeFx() {
    fx.width = window.innerWidth;
    fx.height = window.innerHeight;
  }

  function burstConfetti() {
    if (prefersReduced) return;
    var count = 140;
    for (var i = 0; i < count; i++) {
      confetti.push({
        x: fx.width / 2 + (Math.random() - 0.5) * 120,
        y: fx.height * 0.32,
        vx: (Math.random() - 0.5) * 11,
        vy: Math.random() * -13 - 4,
        size: 5 + Math.random() * 7,
        color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        life: 0
      });
    }
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxFrame); }
  }

  function fxFrame() {
    fxCtx.clearRect(0, 0, fx.width, fx.height);
    var gravity = 0.32;
    for (var i = confetti.length - 1; i >= 0; i--) {
      var p = confetti[i];
      p.vy += gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      p.life++;
      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      fxCtx.fillStyle = p.color;
      fxCtx.globalAlpha = Math.max(0, 1 - p.life / 130);
      fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      fxCtx.restore();
      if (p.y > fx.height + 40 || p.life > 150) confetti.splice(i, 1);
    }
    if (confetti.length > 0) {
      requestAnimationFrame(fxFrame);
    } else {
      fxRunning = false;
      fxCtx.clearRect(0, 0, fx.width, fx.height);
    }
  }

  /* ---------- Controls ---------- */
  function setButtonsDisabled(d) {
    updateBtn.disabled = d;
    resetBtn.disabled = d;
    hubBtn.disabled = d;
  }

  function parseNames(text) {
    return text.split("\n")
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  function syncTextarea() { namesInput.value = names.join("\n"); }

  function updateFromTextarea() {
    if (spinning) return;
    names = parseNames(namesInput.value);
    syncTextarea();
    rotation = 0;
    drawWheel();
    updateStrap();
    ticker.classList.remove("win");
    ticker.textContent = names.length ? "Ready!" : "Add some names";
  }

  function resetNames() {
    if (spinning) return;
    names = DEFAULT_NAMES.slice();
    syncTextarea();
    rotation = 0;
    drawWheel();
    updateStrap();
    ticker.classList.remove("win");
    ticker.textContent = "Ready!";
  }

  // Wire up
  hubBtn.addEventListener("click", spin);
  updateBtn.addEventListener("click", updateFromTextarea);
  resetBtn.addEventListener("click", resetNames);
  window.addEventListener("resize", function () {
    resizeFx();
    fitCanvas();
    drawWheel();
  });

  // Init
  syncTextarea();
  resizeFx();
  fitCanvas();
  drawWheel();
  updateStrap();
})();
</script>
</body>
</html>
